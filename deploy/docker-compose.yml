# Run the multi-user web service with automatic HTTPS (Let's Encrypt) through Caddy.
#
#   cd deploy
#   cp .env.example .env    # set DOMAIN, ADMIN_EMAIL, ADMIN_PASSWORD and the Suunto app keys
#   docker compose up -d
#
# Then open https://$DOMAIN, sign in as the administrator and add https://$DOMAIN/mcp
# as a custom connector in Claude.
#
# The project name keeps this stack apart from other Compose stacks in a folder called "deploy"
# (for example MCP for PADI or MCP for iCloud): their containers and volumes would otherwise
# share names.
name: suunto-mcp

services:
  suunto-mcp:
    build: ..
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional. If empty, a key is generated once in the data volume (back it up).
      MASTER_KEY: ${MASTER_KEY:-}
      # The keys of your app in the Suunto API Zone. Without them the service starts, demo
      # accounts work, and real accounts cannot connect Suunto yet.
      SUUNTO_CLIENT_ID: ${SUUNTO_CLIENT_ID:-}
      SUUNTO_CLIENT_SECRET: ${SUUNTO_CLIENT_SECRET:-}
      SUUNTO_SUBSCRIPTION_KEY: ${SUUNTO_SUBSCRIPTION_KEY:-}
      # Optional. Default: https://DOMAIN/suunto/callback (register it in the API Zone). A value
      # must be on https://DOMAIN with the path /suunto/callback, or the service does not start.
      SUUNTO_REDIRECT_URI: ${SUUNTO_REDIRECT_URI:-}
      # Optional: limits of the requests to Suunto. Empty means the default: 10 per minute for the
      # whole service and 100 per user per day; 0 means no limit. Raise them after Suunto accepts
      # the Production subscription.
      SUUNTO_CALLS_PER_MINUTE: ${SUUNTO_CALLS_PER_MINUTE:-}
      SUUNTO_CALLS_PER_USER_PER_DAY: ${SUUNTO_CALLS_PER_USER_PER_DAY:-}
      SUUNTO_CALLS_PER_USER_PER_WEEK: ${SUUNTO_CALLS_PER_USER_PER_WEEK:-}
      # Optional: e-mails to administrators about access requests (your own SMTP server).
      SMTP_URL: ${SMTP_URL:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [suunto-mcp]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to suunto-mcp:3000
    volumes:
      - caddy-data:/data

volumes:
  data:
  caddy-data:
