# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io), the
# public list of MCP servers that AI apps and MCP directories read.
#
# Run workflow:  Actions > MCP Registry > Run workflow (from the default branch).
# Tag push:      pushing a tag v<version> (for example v1.2.0) publishes that version.
#
# Login uses GitHub Actions OIDC (id-token: write), so no secret is needed. The registry grants
# the namespace io.github.<repository owner>/* with the owner's exact casing, which is why the
# name in server.json starts with io.github.Mrc527/.
#
# Version: the registry refuses a version it already has, and published versions can never be
# changed. The version is always the one in package.json (a tag must match it). If that version is
# already in the registry, the run stops before publishing: bump "version" in package.json and run
# again. A suffix such as 1.1.0-<run number> is not used on purpose: it sorts below 1.1.0, so the
# registry would not mark it as the latest version and AI apps would keep showing the old entry.
name: MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC login to the MCP Registry
    env:
      REGISTRY_URL: https://registry.modelcontextprotocol.io
      # Upgrade deliberately: change both lines. The checksum is the one in that release's
      # registry_<version>_checksums.txt for mcp-publisher_linux_amd64.tar.gz.
      MCP_PUBLISHER_VERSION: v1.8.8
      MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
    steps:
      - name: Check branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "::error title=Wrong branch::Publish from the default branch ($DEFAULT_BRANCH). In 'Run workflow', choose it under 'Use workflow from' (you chose $GITHUB_REF_NAME)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir"
          cd "$dir"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          echo "$dir" >>"$GITHUB_PATH"

      - name: Set the version
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          name="$(jq -r .name server.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error title=Tag does not match package.json::The tag is $GITHUB_REF_NAME but package.json says $version. Tag the commit whose package.json has the version you want (v$version), or bump package.json first."
            exit 1
          fi
          enc_name="$(jq -rn --arg s "$name" '$s|@uri')"
          enc_version="$(jq -rn --arg s "$version" '$s|@uri')"
          # 404: this version is new. 200: already published (deleted versions count too).
          # A network error gives 000 and a warning instead of stopping the step without a message.
          status="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            "$REGISTRY_URL/v0.1/servers/$enc_name/versions/$enc_version?include_deleted=true")" || true
          case "$status" in
            404) ;;
            200)
              echo "::error title=Version already published::$name $version is already in the MCP Registry, and published versions cannot change. Bump \"version\" in package.json (for example with npm version patch), commit, and run again."
              exit 1
              ;;
            *) echo "::warning::Could not check whether $version is already published (HTTP $status). Publishing anyway." ;;
          esac
          jq --arg v "$version" '.version = $v' server.json >"$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json
          {
            echo "name=$name"
            echo "version=$version"
            echo "entry-url=$REGISTRY_URL/v0.1/servers/$enc_name/versions/$enc_version"
            echo "latest-url=$REGISTRY_URL/v0.1/servers/$enc_name/versions/latest"
          } >>"$GITHUB_OUTPUT"
          echo "Publishing $name version $version"

      - name: Validate server.json
        run: mcp-publisher validate server.json

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish
        run: mcp-publisher publish server.json

      - name: Log out
        if: always()
        run: mcp-publisher logout || true

      - name: Show the registry entry
        env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          ENTRY_URL: ${{ steps.version.outputs.entry-url }}
          LATEST_URL: ${{ steps.version.outputs.latest-url }}
        run: |
          echo "Registry API entry: $ENTRY_URL"
          echo "Latest version:     $LATEST_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$ENTRY_URL" | jq . \
            || echo "::warning::The entry is not readable yet; check $ENTRY_URL in a minute."
          {
            echo "### MCP Registry"
            echo "- Published \`$NAME\` version \`$VERSION\`"
            echo "- API entry: $ENTRY_URL"
            echo "- Latest version: $LATEST_URL"
          } >>"$GITHUB_STEP_SUMMARY"
